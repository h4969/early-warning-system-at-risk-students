{% extends 'admins/adminbase.html' %}

{% block contents %}

<style>
#tooplate_main {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto 30px auto;
    padding: 20px;
    box-sizing: border-box;
}

/* ===== PAGE-SPECIFIC HEADING SPACING ===== */
.page-heading {
    width: 100%;
    max-width: 1200px;        /* match table width */
    margin: 70px auto 20px;   /* 🔑 space from navbar */
    text-align: center;
}

/* keep your existing animation intact */
.page-heading h2 {
    margin: 0;
}

/* Chart Card */
.chart-card{
    background:#ffffff;
    border-radius:16px;
    padding:40px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);

    width: 90%;
    max-width: 1200px;
    margin: 30px auto;
}

/* Chart Size */
#myChart{
    width: 90% !important;
    height: 450px !important;
}
@media (max-width: 768px) {

    .page-heading {
        margin: 40px auto 20px;   /* 🔑 less space for mobile */
        padding: 0 10px;
    }

    .page-heading h2 {
        font-size: 20px;          /* smaller heading */
    }
}
</style>

<div class="page-heading">
    <h2>Accuracy Graphs</h2>
</div>

<div class="chart-card">
    <canvas id="myChart"></canvas>
</div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function(){

    var knn = parseFloat("{{ knn_acc|default:'85' }}");
    var dt  = parseFloat("{{ dt_acc|default:'88' }}");
    var nn  = parseFloat("{{ nn_acc|default:'90' }}");
    var nb  = parseFloat("{{ nb_acc|default:'80' }}");
    var svm = parseFloat("{{ svm_acc|default:'92' }}");

    const ctx = document.getElementById('myChart').getContext('2d');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['KNN','Decision Tree','Neural Network','Naive Bayes','SVM'],
            datasets: [{
                label: 'Accuracy (%)',
                data: [knn, dt, nn, nb, svm],
                backgroundColor: [
                   ' #0D9488',	
	               ' #1E40AF',	
	               ' #4F46E5',	
	               ' #0EA5E9',	
                   ' #334155'   // Purple
                ],
                hoverBackgroundColor: [
                    '#0D9488',   // Green
                    '#20B2AA',   // Blue
                    '#5EEAD4',   // Orange
                    '#99F6E4',   // Pink
                    '#0F172A'    // Purple
                ],
                borderRadius: 8
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,

            plugins: {
                legend: {
                    labels: {
                        font: {
                            size: 14
                        }
                    }
                }
            },

            scales: {
                y: {
                    beginAtZero: true,
                    max: 100,
                    ticks: {
                        stepSize: 10
                    }
                },
                x: {
                    ticks: {
                        font: {
                            size: 12
                        }
                    }
                }
            }
        }
    });

});
</script>
<script>
document.addEventListener("DOMContentLoaded", function(){

    var knn = parseFloat("{{ knn_acc|default:'85' }}");
    var dt  = parseFloat("{{ dt_acc|default:'88' }}");
    var nn  = parseFloat("{{ nn_acc|default:'90' }}");
    var nb  = parseFloat("{{ nb_acc|default:'80' }}");
    var svm = parseFloat("{{ svm_acc|default:'92' }}");

    const ctx = document.getElementById('myChart').getContext('2d');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['KNN','Decision Tree','Neural Network','Naive Bayes','SVM'],
            datasets: [{
                label: 'Accuracy (%)',
                data: [knn, dt, nn, nb, svm],
                backgroundColor: [
                   '#0D9488',  
                   '#1E40AF',  
                   '#4F46E5',  
                   '#0EA5E9',  
                   '#334155'  
                ],
                hoverBackgroundColor: [
                    '#0D9488',  
                    '#20B2AA',  
                    '#5EEAD4',  
                    '#99F6E4',  
                    '#0F172A'   
                ],
                borderRadius: 8,

                /* 🔑 REDUCE BAR WIDTH HERE */
                barPercentage: 0.5,      // Controls the width of the individual bar (0.1 to 1.0)
                categoryPercentage: 0.6  // Controls the width of the space available for the bar
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: {
                        font: {
                            size: 14,
                            family: "'Segoe UI', sans-serif"
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    max: 100,
                    grid: {
                        color: 'rgba(0, 0, 0, 0.05)' // Faint professional grid lines
                    },
                    ticks: {
                        stepSize: 10
                    }
                },
                x: {
                    grid: {
                        display: false // Hide vertical lines for a cleaner look
                    },
                    ticks: {
                        font: {
                            size: 12
                        }
                    }
                }
            }
        }
    });
});
</script>
{% endblock %}
