{% extends 'base.html' %}
{% load static %}

{% block contents %}
<style>
    #hero-section {
        width: 100%;
        height: calc(100vh - 60px); 
        background-image: url("{% static '/images/home_background_image.jpg' %}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .hero-overlay {
        position: absolute;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .hero-text { text-align: center; color: white; z-index: 5; padding: 0 20px; }
    .hero-text h1 { font-size: clamp(2.2rem, 6vw, 4rem); margin-bottom: 20px; font-weight: 800; }
    .btn-get-started {
        background-color: #20B2AA; color: white; border: none; border-radius: 50px;
        padding: 15px 40px; font-size: 1.1rem; font-weight: 600; cursor: pointer;
    }
</style>

<section id="hero-section">
    <div class="hero-overlay">
        <div class="hero-text">
            <h1>Early Warning System</h1>
            <button class="btn-get-started" onclick="location.href='{% url 'UserRegisterActions' %}'">Get Started</button>
        </div>
    </div>
</section>
{% endblock %}
